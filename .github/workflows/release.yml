name: Build Windows exe and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip "pillow>=10.1" pyinstaller

      - name: Smoke-test core (dry run)
        run: python gmaps_maxres.py "https://www.google.com/maps/@55.736578,37.5334196,120m" --dry-run

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --hide-console hide-early
          --name GMaps-MaxRes gmaps_maxres_gui.py

      - name: Test exe from the command line
        shell: pwsh
        run: |
          $exe = "dist/GMaps-MaxRes.exe"
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "--help failed" }
          & $exe "not a link"
          if ($LASTEXITCODE -eq 0) { throw "bad link should fail with non-zero exit code" }
          & $exe "https://www.google.com/maps/@55.736578,37.5334196,60m" -o cli_test.png
          if ($LASTEXITCODE -ne 0) { throw "CLI download failed" }
          $png = Get-ChildItem cli_test.png
          if ($png.Length -lt 100000) { throw "PNG too small" }
          "CLI OK: $($png.Name) $($png.Length) bytes"
          & $exe "https://yandex.ru/maps/?ll=37.533420%2C55.736578&z=17&l=sat" --width-m 80 -o yandex_test.png
          if ($LASTEXITCODE -ne 0) { throw "Yandex CLI download failed" }
          $png = Get-ChildItem yandex_test.png
          if ($png.Length -lt 50000) { throw "Yandex PNG too small" }
          "Yandex OK: $($png.Name) $($png.Length) bytes"
          $global:LASTEXITCODE = 0

      - name: Test exe starts the window when double-clicked
        shell: pwsh
        run: |
          $p = Start-Process dist/GMaps-MaxRes.exe -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          $all = @(Get-Process GMaps-MaxRes -ErrorAction SilentlyContinue)
          "launcher exited: $($p.HasExited); running instances: $($all.Count)"
          $all | Where-Object { $_.MainWindowTitle } | ForEach-Object { "window: $($_.MainWindowTitle)" }
          $all | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { throw "console launcher should hand over to a console-less GUI process and exit" }
          if ($all.Count -lt 1) { throw "GUI process is not running" }

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Download `GMaps-MaxRes.exe` below and double-click it** - nothing to install.

          1. Open the place in Google Maps or Yandex Maps (satellite view) and copy the link from the browser.
          2. Paste it into the app and press **Download**.
          3. The PNG is saved to `Downloads\GMaps MaxRes`; its real width and height are shown in the window and in the file name (mm).

          **Command line:** the same exe works in cmd / PowerShell when given arguments:
          `GMaps-MaxRes.exe "<google or yandex maps link>" [-o out.png] [--width-m N] [--source google|yandex] [--jpg] [--dry-run]` (see `--help`).

          If Windows shows "Windows protected your PC", click **More info -> Run anyway** (the app is not code-signed).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/GMaps-MaxRes.exe --clobber
          else
            gh release create "$TAG" dist/GMaps-MaxRes.exe \
              --title "GMaps MaxRes $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
